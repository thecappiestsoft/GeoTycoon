  <style>/* ==== css/base.css ==== */
/* =========================================================
   GeoTycoon — base.css: zmienne motywów (jasny/ciemny), reset, typografia
   ========================================================= */

:root,
[data-theme="light"] {
  --bg: #eef3f1;
  --bg-elev: #ffffff;
  --bg-sunken: #e2eae7;
  --surface-2: #f6f9f8;
  --border: #c9d6d1;
  --border-strong: #9fb3ac;
  --text: #17262b;
  --text-muted: #51646a;
  --primary: #0f6e76;
  --primary-hover: #0b5a61;
  --primary-text: #ffffff;
  --accent: #e0a526;
  --good: #1d7a3a;
  --good-bg: #e3f4e7;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --warn: #8a5a00;
  --warn-bg: #fff2d6;
  --focus: #1b66d6;
  --shadow: 0 2px 10px rgba(23, 38, 43, 0.10);
  --shadow-lg: 0 12px 40px rgba(23, 38, 43, 0.22);

  /* mapa */
  --sea: #a9d3e6;
  --sea-line: rgba(255, 255, 255, 0.45);
  --country-stroke: #3d5a52;
  --region-stroke: #ffffff;
  --t-lowland: #b8d98c;
  --t-mountains: #b9a58f;
  --t-coastal: #9fd3b4;
  --t-desert: #ecd28e;
  --t-forest: #6fae74;
  --t-riverValley: #8fcf86;
  --river: #3d8fd1;
  --map-label: #13221f;
  --map-label-halo: rgba(255, 255, 255, 0.85);
  --hatch: rgba(70, 50, 40, 0.55);
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0f1719;
  --bg-elev: #172226;
  --bg-sunken: #0b1214;
  --surface-2: #1d2a2f;
  --border: #2c3d43;
  --border-strong: #46606a;
  --text: #e5eef0;
  --text-muted: #9fb2b8;
  --primary: #3fb7bf;
  --primary-hover: #5fcad1;
  --primary-text: #062a2d;
  --accent: #f0bf4c;
  --good: #6fd38a;
  --good-bg: #173524;
  --bad: #ff8a80;
  --bad-bg: #3d1d1b;
  --warn: #f3c768;
  --warn-bg: #3a2e12;
  --focus: #7fb3ff;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.55);

  --sea: #16384a;
  --sea-line: rgba(140, 190, 220, 0.14);
  --country-stroke: #0a1012;
  --region-stroke: #0f1719;
  --t-lowland: #5d7a3d;
  --t-mountains: #6e5f50;
  --t-coastal: #3f7a62;
  --t-desert: #8f7a42;
  --t-forest: #2f6237;
  --t-riverValley: #4b7f43;
  --river: #5aa9e8;
  --map-label: #f2f7f6;
  --map-label-halo: rgba(8, 14, 16, 0.85);
  --hatch: rgba(255, 220, 200, 0.45);
  color-scheme: dark;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { font-size: 16px; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif,
    "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s, color .25s;
}

h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: 1.8rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
h4 { font-size: .95rem; }
p { margin: 0 0 .75em; }
a { color: var(--primary); }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 1000;
  background: var(--primary); color: var(--primary-text);
  padding: 8px 14px; border-radius: 8px; text-decoration: none;
}
.skip-link:focus { top: 8px; }

.muted { color: var(--text-muted); }
.small { font-size: .85rem; }
.ok-text { color: var(--good); }

/* Wyłączone animacje (ustawienie gracza lub systemowe) */
body.no-anim *, body.no-anim *::before, body.no-anim *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Nagłówki fokusowane programowo (po zmianie ekranu) — bez ramki */
[tabindex="-1"]:focus:not(:focus-visible),
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }

</style>
  <style>/* ==== css/layout.css ==== */
/* =========================================================
   GeoTycoon — layout.css: nagłówek, stopka, ekrany, układ strony
   ========================================================= */

body {
  display: flex;
  flex-direction: column;
}

.app-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  height: 52px;
  padding: 0 16px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.brand {
  display: inline-flex; align-items: center; gap: 8px;
  background: none; border: 0; cursor: pointer;
  padding: 4px 8px; border-radius: 8px;
  font-weight: 800; font-size: 1.2rem; letter-spacing: .2px;
}
.brand:hover { background: var(--surface-2); }
.brand-logo { font-size: 1.4rem; }
.brand-name { color: var(--primary); }

.header-tools { display: flex; align-items: center; gap: 10px; }

.lang-switch {
  display: inline-flex; align-items: center;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 2px; background: var(--surface-2);
}
.lang-switch button {
  border: 0; background: none; cursor: pointer;
  min-width: 40px; height: 32px; padding: 0 10px;
  border-radius: 999px; font-weight: 700; font-size: .9rem; color: var(--text-muted);
}
.lang-switch button.active { background: var(--primary); color: var(--primary-text); }
.lang-switch button:not(.active):hover { color: var(--text); }
.lang-sep { color: var(--border-strong); padding: 0 2px; }

main {
  flex: 1 0 auto;
  display: flex; flex-direction: column;
  outline: none;
}

.screen { flex: 1; display: flex; flex-direction: column; }

.app-footer {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: .85rem;
  color: var(--text-muted);
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
}
.app-footer .copyright { font-weight: 600; color: var(--text); }
.footer-sep { color: var(--border-strong); }

/* ---------- Strony (menu, instrukcja, ustawienia) ---------- */
.page-wrap {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 20px 40px;
}
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; }
.page-actions { display: flex; justify-content: flex-end; margin-top: 18px; }

.prose .card { margin-bottom: 14px; }
.prose ol, .prose ul { padding-left: 1.3em; margin: 0; }
.prose li { margin-bottom: .4em; }

/* ---------- Menu ---------- */
.menu-wrap {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  padding: 30px 20px;
  background:
    radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--primary) 18%, transparent), transparent),
    radial-gradient(900px 400px at 100% 110%, color-mix(in srgb, var(--accent) 16%, transparent), transparent);
}
.menu-hero { text-align: center; max-width: 640px; }
.logo { font-size: 4.2rem; line-height: 1; filter: drop-shadow(0 6px 12px rgba(0,0,0,.2)); }
.title { font-size: 3rem; margin: 8px 0 0; color: var(--primary); letter-spacing: .5px; }
.subtitle { font-size: 1.15rem; font-weight: 600; color: var(--text-muted); }
.pitch { font-size: 1.02rem; }
.menu-buttons { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); }
.menu-buttons .btn { width: 100%; justify-content: flex-start; }
.save-info { margin: -4px 0 4px; text-align: center; font-size: .85rem; color: var(--text-muted); }
.menu-wrap .notice { max-width: 520px; }

/* ---------- Ekran końcowy ---------- */
.end-wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 24px 20px 40px; }
.end-hero { text-align: center; margin-bottom: 20px; }
.end-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.end-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }

@media (max-width: 820px) {
  .end-grid { grid-template-columns: 1fr; }
  .title { font-size: 2.4rem; }
}
@media (max-width: 520px) {
  .app-header { padding: 0 8px; }
  .brand-name { font-size: 1rem; }
}

</style>
  <style>/* ==== css/components.css ==== */
/* =========================================================
   GeoTycoon — components.css: przyciski, karty, okna, komunikaty, paski, przełączniki
   ========================================================= */

/* ---------- Przyciski ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background-color .15s, border-color .15s, transform .08s, box-shadow .15s;
  user-select: none;
}
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-lg { min-height: 50px; padding: 10px 22px; font-size: 1.05rem; }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: var(--primary-text); box-shadow: var(--shadow); }
.btn-primary:hover:not([disabled]) { background: var(--primary-hover); }
.btn-secondary { background: var(--bg-elev); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not([disabled]) { background: var(--surface-2); border-color: var(--primary); }
.btn-ghost { background: transparent; color: var(--text); }
.btn-ghost:hover:not([disabled]) { background: var(--surface-2); }
.btn-warning { background: var(--accent); color: #1d1500; }
.btn-warning:hover:not([disabled]) { filter: brightness(1.06); }
.btn-danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn-danger:hover:not([disabled]) { filter: brightness(0.97); }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text);
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover:not([disabled]) { background: var(--surface-2); border-color: var(--primary); }
.icon-btn.danger:hover:not([disabled]) { border-color: var(--bad); background: var(--bad-bg); }
.icon-btn[disabled] { opacity: .45; cursor: not-allowed; }
.theme-toggle { border-radius: 999px; color: var(--primary); }

.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- Karty i sekcje ---------- */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
}

.notice {
  border-radius: 10px;
  padding: 10px 14px;
  border: 1px solid;
  margin: 8px 0;
}
.notice-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--text); }
.notice-warn { background: var(--warn-bg); border-color: var(--accent); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: .82rem; font-weight: 600;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 8px;
  font-size: .8rem; font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface-2);
}
.chip-good { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip-bad { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

.plain-list { list-style: none; padding: 0; margin: 0 0 12px; }
.plain-list li { padding: 3px 0; }

/* ---------- Paski (meter) ---------- */
.attrs, .dims { display: flex; flex-direction: column; gap: 6px; }
.attr {
  display: grid;
  grid-template-columns: minmax(130px, 1.2fr) 2fr 34px;
  align-items: center; gap: 8px;
  font-size: .86rem;
}
.attr-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attr-value { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar {
  height: 10px; border-radius: 999px;
  background: var(--bg-sunken);
  overflow: hidden;
  border: 1px solid var(--border);
}
.bar-fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .4s ease; }
.bar-high .bar-fill { background: var(--good); }
.bar-mid .bar-fill { background: var(--accent); }
.bar-low .bar-fill { background: var(--bad); }
.bar-inverse.bar-high .bar-fill { background: var(--bad); }
.bar-inverse.bar-low .bar-fill { background: var(--good); }

/* ---------- Formularze ---------- */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 600; }
select, input[type="text"] {
  min-height: 40px;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-elev);
}

.toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.toggle-row:last-child { border-bottom: 0; }
.toggle-row label { font-weight: 600; cursor: pointer; }
.toggle-row p { margin: 2px 0 0; }

.switch {
  appearance: none; -webkit-appearance: none;
  position: relative;
  width: 52px; height: 30px; flex-shrink: 0;
  border-radius: 999px;
  background: var(--border-strong);
  cursor: pointer;
  transition: background .2s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .2s;
}
.switch:checked { background: var(--primary); }
.switch:checked::after { transform: translateX(22px); }

/* ---------- Tabele ---------- */
.table-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th, .table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.table thead th { background: var(--surface-2); font-weight: 700; }
.table td:nth-child(n+2) { font-variant-numeric: tabular-nums; }
.table tr.total th, .table tr.total td { font-weight: 800; border-top: 2px solid var(--border-strong); }
.table-compact th, .table-compact td { padding: 4px 8px; text-align: right; }
.table-compact th:first-child, .table-compact td:first-child { text-align: left; }

/* ---------- Okna modalne ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: rgba(8, 16, 18, 0.55);
  animation: fadeIn .18s ease;
}
.modal {
  width: min(560px, 100%);
  max-height: calc(100vh - 32px);
  display: flex; flex-direction: column;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  animation: popIn .2s ease;
}
.modal-wide { width: min(860px, 100%); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.modal-title { margin: 0; font-size: 1.25rem; }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-actions {
  display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap;
  padding: 12px 18px;
  border-top: 1px solid var(--border);
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* ---------- Toast ---------- */
.toast-root {
  position: fixed; z-index: 150; /* pod oknami modalnymi */
  right: 16px; top: 64px;
  display: flex; flex-direction: column; gap: 8px;
  max-width: min(420px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-left: 5px solid var(--primary);
  box-shadow: var(--shadow-lg);
  font-size: .92rem;
  animation: slideIn .25s ease;
  transition: opacity .4s, transform .4s;
}
.toast-good { border-left-color: var(--good); }
.toast-bad { border-left-color: var(--bad); }
.toast-hide { opacity: 0; transform: translateX(20px); }
@keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }

/* ---------- Komunikaty z powodem blokady ---------- */
.reason { color: var(--bad); font-size: .82rem; font-weight: 600; margin: 0; }

/* ---------- Debug ---------- */
.debug .row-btns { margin-bottom: 10px; }
.state-json {
  max-height: 320px; overflow: auto;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px; font-size: .75rem;
}
.noscript { padding: 30px; text-align: center; }

</style>
  <style>/* ==== css/game.css ==== */
/* =========================================================
   GeoTycoon — game.css: ekran gry, mapa, panele, wydarzenia, podsumowania, wykresy
   ========================================================= */

/* ---------- Układ ekranu gry ---------- */
.screen-game { min-height: 0; }
.game {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: calc(100vh - 52px - 37px); /* nagłówek + stopka */
  min-height: 600px;
}
.game-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(340px, 31vw, 440px);
  min-height: 0;
}

/* ---------- Górny pasek zasobów ---------- */
.topbar {
  display: flex; align-items: stretch; gap: 6px;
  padding: 8px 12px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.year-box {
  display: flex; flex-direction: column; justify-content: center;
  min-width: 92px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--primary); color: var(--primary-text);
}
.year-box .muted { color: inherit; opacity: .85; }
.year-num { font-size: 1.2rem; }
.year-progress { height: 4px; border-radius: 4px; background: rgba(255,255,255,.3); margin-top: 3px; }
.year-progress div { height: 100%; border-radius: 4px; background: currentColor; }

.res {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  flex: 1 1 0; min-width: 118px;
  padding: 4px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.res-icon { font-size: 1.45rem; }
.res-text { display: flex; flex-direction: column; min-width: 0; }
.res-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); font-weight: 700; }
.res-value { font-size: 1.08rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.res-forecast { font-size: .72rem; color: var(--text-muted); white-space: nowrap; }
.res-warn { border-color: var(--bad); background: var(--bad-bg); }
.res-alert { position: absolute; top: 2px; right: 4px; font-size: .9rem; }
.res-flash { animation: flash 1s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent); } 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- Obszar mapy ---------- */
.map-area {
  position: relative;
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
  padding: 8px 10px 10px;
}
.goal-strip {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  padding: 6px 12px; margin-bottom: 8px;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
  font-size: .88rem;
}
.goal-scn { font-weight: 700; }
.goal-inv { margin-left: auto; }

.map {
  position: relative;
  flex: 1; min-height: 0;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  background: var(--sea);
}
.map-svg { display: block; width: 100%; height: 100%; }
.map-sea { fill: var(--sea); }
.wave-line { fill: none; stroke: var(--sea-line); stroke-width: 1.5; }
.sea-label { fill: var(--map-label); opacity: .45; font-size: 18px; font-style: italic; letter-spacing: 6px; }
.map-country { fill: none; stroke: var(--country-stroke); stroke-width: 5; stroke-linejoin: round; }

.region { cursor: pointer; outline: none; }
.region-shape {
  stroke: var(--region-stroke); stroke-width: 2.5; stroke-linejoin: round;
  transition: filter .15s, stroke-width .15s;
}
.terrain-lowland .region-shape { fill: var(--t-lowland); }
.terrain-mountains .region-shape { fill: var(--t-mountains); }
.terrain-coastal .region-shape { fill: var(--t-coastal); }
.terrain-desert .region-shape { fill: var(--t-desert); }
.terrain-forest .region-shape { fill: var(--t-forest); }
.terrain-riverValley .region-shape { fill: var(--t-riverValley); }
.region:hover .region-shape { filter: brightness(1.08) saturate(1.1); }
.region:focus-visible .region-shape { stroke: var(--focus); stroke-width: 6; }
.region.selected .region-shape { stroke: var(--accent); stroke-width: 6; filter: brightness(1.06); }
.region.has-event .region-shape { stroke-dasharray: 10 6; stroke: var(--bad); stroke-width: 4; }
.region.selected.has-event .region-shape { stroke: var(--accent); }
.region-pollution { pointer-events: none; }
.hatch-line { stroke: var(--hatch); stroke-width: 3; }

.map-river {
  fill: none; stroke: var(--river); stroke-width: 7; stroke-linecap: round;
  pointer-events: none; opacity: .9;
}
.labels-layer { pointer-events: none; }
.labels-layer text { text-anchor: middle; paint-order: stroke; stroke: var(--map-label-halo); stroke-linejoin: round; }
.region-icon { font-size: 30px; stroke-width: 0; }
.region-name { font-size: 20px; font-weight: 800; fill: var(--map-label); stroke-width: 4px; }
.region-name.selected { text-decoration: underline; }
.region-buildings { font-size: 22px; fill: var(--map-label); stroke-width: 3px; letter-spacing: 2px; }
.event-marker circle { fill: var(--bad); stroke: #fff; stroke-width: 3; animation: pulse 1.6s infinite; transform-box: fill-box; transform-origin: center; }
.event-marker text { font-size: 20px; stroke-width: 0; }
.modifier-marker { font-size: 22px; stroke-width: 0; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.compass path { fill: var(--map-label); opacity: .7; }
.compass text { font-size: 16px; font-weight: 800; fill: var(--map-label); text-anchor: middle; opacity: .7; }

.map-tip {
  position: absolute; z-index: 5;
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 12px;
  background: var(--bg-elev); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow-lg);
  font-size: .88rem;
  pointer-events: none;
  white-space: nowrap;
}

/* ---------- Samouczek (pasek nad mapą) ---------- */
.tutorial {
  margin-bottom: 8px;
  padding: 6px 10px;
  background: var(--warn-bg);
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  border-left: 5px solid var(--accent);
  border-radius: 10px;
  font-size: .88rem;
}
.tutorial-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tut-badge { font-weight: 800; white-space: nowrap; }
.tut-current { flex: 1; font-weight: 600; min-width: 200px; }
.tutorial-head .icon-btn { width: 30px; height: 30px; }
.tutorial-steps { list-style: none; margin: 6px 0 2px; padding: 0; columns: 2; column-gap: 16px; }
.tutorial-steps li { display: flex; gap: 8px; padding: 2px 0; color: var(--text-muted); break-inside: avoid; }
.tutorial-steps li.current { color: var(--text); font-weight: 700; }
.tutorial-steps li.done { text-decoration: line-through; }
.tut-check { width: 16px; flex-shrink: 0; text-align: center; color: var(--good); }
.tutorial-steps li.current .tut-check { color: var(--accent); }

/* ---------- Panel boczny ---------- */
.side {
  display: flex; flex-direction: column;
  min-height: 0;
  border-left: 1px solid var(--border);
  background: var(--bg-elev);
}
.panel { padding: 12px 14px; }
.region-panel { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.events-panel {
  flex: 0 0 auto; max-height: 36%;
  overflow-y: auto;
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}

.empty-panel { text-align: center; padding: 30px 10px; color: var(--text-muted); }
.empty-icon { font-size: 3rem; }

.region-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.region-head > div { flex: 1; min-width: 0; }
.region-head h2 { margin: 0; outline: none; }
.region-head p { margin: 2px 0 0; font-size: .85rem; }
.region-head-icon { font-size: 2.2rem; line-height: 1; }
.region-desc { font-size: .92rem; }

.section { margin: 12px 0; }
.section > summary { cursor: pointer; list-style: none; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary h3 { display: inline; }
.section > summary::after { content: " ▾"; color: var(--text-muted); }
.section:not([open]) > summary::after { content: " ▸"; }
.section > summary + .attrs { margin-top: 8px; }

.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.slot {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
}
.slot-empty { border-style: dashed; background: transparent; }
.slot-icon { font-size: 1.4rem; width: 30px; text-align: center; }
.slot-info { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Karty budynków */
.bcards { display: flex; flex-direction: column; gap: 10px; }
.bcard {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  box-shadow: var(--shadow);
}
.bcard-disabled { background: var(--surface-2); box-shadow: none; }
.bcard-disabled .bcard-head, .bcard-disabled .bcard-desc, .bcard-disabled .chips { opacity: .7; }
.bcard-head { display: flex; gap: 10px; align-items: center; }
.bcard-icon { font-size: 1.9rem; }
.bcard-title h4 { margin: 0; font-size: 1rem; }
.bcard-cost { font-size: .82rem; font-weight: 600; }
.cost-discount { color: var(--good); }
.cost-old { color: var(--text-muted); margin-left: 4px; }
.bcard-desc { font-size: .85rem; margin: 6px 0 2px; }
.req-list { list-style: none; padding: 0; margin: 4px 0; font-size: .8rem; }
.req-ok { color: var(--good); }
.req-bad { color: var(--bad); }
.edu { font-size: .82rem; margin: 4px 0; }
.edu summary { cursor: pointer; color: var(--primary); font-weight: 600; }
.edu p { margin: 4px 0 0; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.bcard-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.bcard-foot .btn { margin-left: auto; }

/* Panel wydarzeń */
.events-panel h3 { margin-bottom: 6px; }
.event-card {
  padding: 10px; border-radius: 12px;
  background: var(--bg-elev);
  border: 2px solid var(--accent);
  display: flex; flex-direction: column; gap: 8px;
}
.event-card.tone-bad { border-color: var(--bad); }
.event-card.tone-good { border-color: var(--good); }
.event-card-head { display: flex; gap: 10px; align-items: center; }
.event-icon-sm { font-size: 1.8rem; }
.log-title { margin: 10px 0 4px; }
.event-log { list-style: none; padding: 0; margin: 0; font-size: .82rem; }
.event-log li { padding: 3px 0; border-bottom: 1px dashed var(--border); }
.log-year { display: inline-block; min-width: 54px; font-weight: 700; color: var(--text-muted); }

/* ---------- Dolny pasek ---------- */
.bottombar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 12px;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
}
.bb-left { display: flex; flex-wrap: wrap; gap: 4px; }
.btn-end-turn { min-width: 220px; font-size: 1.1rem; }
.btn-end-turn.needs-decision { background: var(--accent); color: #1d1500; animation: pulse-btn 1.8s infinite; }
@keyframes pulse-btn { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }

/* ---------- Okno wydarzenia ---------- */
.event-hero {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 12px 14px; border-radius: 12px;
  background: var(--surface-2);
  border-left: 6px solid var(--accent);
}
.event-hero.tone-bad { border-left-color: var(--bad); }
.event-hero.tone-good { border-left-color: var(--good); }
.event-icon { font-size: 3rem; line-height: 1; }
.event-meta { font-size: .85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
.event-desc { font-size: 1.05rem; margin: 0; }
.edu-note {
  margin: 12px 0;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--warn-bg);
  border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
}
.edu-note p { margin: 4px 0 0; }
.choices-title { margin-top: 14px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--bg-elev);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.choice:hover:not([disabled]) { border-color: var(--primary); background: var(--surface-2); }
.choice[disabled] { opacity: .6; cursor: not-allowed; }
.choice-letter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; flex-shrink: 0;
  border-radius: 50%;
  background: var(--primary); color: var(--primary-text);
  font-weight: 800;
}
.choice-main { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.choice-desc { font-size: .88rem; color: var(--text-muted); }
.choice-cost { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.choice-cost.free { color: var(--good); }

/* ---------- Podsumowanie tury ---------- */
.delta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.delta-item {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto;
  column-gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.delta-icon { grid-row: 1 / 4; font-size: 1.6rem; align-self: center; }
.delta-label { font-size: .75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
.delta-value { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.delta { font-size: .82rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.delta-up { color: var(--good); }
.delta-down { color: var(--bad); }
.delta-zero { color: var(--text-muted); }
.msg-list { list-style: none; padding: 0; margin: 0 0 12px; }
.msg { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: .93rem; }
.msg-icon { width: 20px; flex-shrink: 0; text-align: center; }
.msg-bad { font-weight: 600; }
.breakdown { margin: 8px 0; }
.breakdown summary { cursor: pointer; font-weight: 600; color: var(--primary); margin-bottom: 6px; }

/* ---------- Statystyki (wykresy) ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.chart-card {
  margin: 0;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-2);
}
.chart-card figcaption { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: .9rem; }
.chart-now { margin-left: auto; font-variant-numeric: tabular-nums; }
.chart-wrap { position: relative; }
.chart { display: block; width: 100%; height: auto; }
.chart-grid { stroke: var(--border); stroke-width: 1; }
.chart-zero { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-axis { font-size: 10px; fill: var(--text-muted); }
.chart-line { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-dot { fill: var(--primary); stroke: var(--surface-2); stroke-width: 2; }
.chart-cross { stroke: var(--text-muted); stroke-width: 1; }
.chart-hit { fill: transparent; cursor: crosshair; }
.chart-tip {
  position: absolute; top: 0; transform: translateX(-50%);
  padding: 2px 8px; border-radius: 6px;
  background: var(--bg-elev); border: 1px solid var(--border);
  font-size: .78rem; font-weight: 700; white-space: nowrap; pointer-events: none;
  box-shadow: var(--shadow);
}
.stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 12px 0; }
.stat-tile {
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 10px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2);
}
.stat-tile strong { font-size: 1.5rem; }
.stat-icon { font-size: 1.2rem; }

/* ---------- Wybór scenariusza ---------- */
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-bottom: 16px; }
.scenario-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  text-align: left;
  padding: 16px;
  border-radius: 16px;
  border: 2px solid var(--border);
  background: var(--bg-elev);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.scenario-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.scenario-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent), var(--shadow); }
.scenario-card.selected .scenario-name::after { content: " ✔"; color: var(--primary); }
.scenario-icon { font-size: 2.4rem; }
.scenario-name { font-size: 1.2rem; }
.difficulty { font-size: .85rem; color: var(--accent); font-weight: 700; }
.scenario-desc { font-size: .92rem; }
.scenario-start, .scenario-goal { font-size: .85rem; color: var(--text-muted); }
.options { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }

/* ---------- Ekran końcowy ---------- */
.score-ring {
  display: inline-flex; align-items: baseline; justify-content: center;
  width: 170px; height: 170px;
  margin: 10px auto;
  border-radius: 50%;
  border: 12px solid var(--primary);
  background: var(--bg-elev);
  box-shadow: var(--shadow-lg);
  padding-top: 42px;
}
.rating-crisis .score-ring { border-color: var(--bad); }
.rating-developing .score-ring { border-color: var(--accent); }
.rating-stable .score-ring { border-color: var(--primary); }
.rating-model .score-ring { border-color: var(--good); }
.score-num { font-size: 3.4rem; font-weight: 900; line-height: 1; }
.score-max { font-size: 1.1rem; color: var(--text-muted); font-weight: 700; }
.rating { font-size: 1.7rem; }
.goal-list { list-style: none; padding: 0; margin: 0 0 14px; }
.goal-list li { padding: 3px 0; font-weight: 600; }

/* ---------- Responsywność ---------- */
@media (max-width: 1100px) {
  .res { min-width: 104px; }
  .res-icon { font-size: 1.2rem; }
}
@media (max-width: 920px) {
  .game { height: auto; min-height: 0; }
  .game-main { grid-template-columns: 1fr; }
  .map { min-height: 380px; aspect-ratio: 960 / 650; flex: none; }
  .side { border-left: 0; border-top: 1px solid var(--border); }
  .events-panel { max-height: none; }
  .tutorial-steps { columns: 1; }
  .bottombar { position: sticky; bottom: 0; z-index: 20; flex-wrap: wrap; }
  .btn-end-turn { min-width: 0; flex: 1; }
  .options { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .bb-left .btn { padding: 6px 8px; font-size: .85rem; }
  .map { min-height: 260px; }
}
@media (max-height: 800px) and (min-width: 921px) {
  .goal-strip { padding: 4px 10px; margin-bottom: 6px; font-size: .82rem; }
  .topbar { padding: 6px 10px; }
  .res-icon { font-size: 1.2rem; }
}

  <script>/* ==== data/balance.js ==== */
/*
 * GeoTycoon — plik balansu gry (konfiguracja liczb).
 * Wszystkie parametry ekonomii, punktacji i limitów są tutaj, a nie w logice/UI.
 * Dane są w plikach .js (a nie .json), aby gra działała po dwukliku index.html
 * (protokół file:// blokuje fetch() plików JSON). Struktura = czysty JSON.
 */
(function (GT) {
  GT.DATA = GT.DATA || {};
  GT.DATA.balance = {
    schemaVersion: 1,
    appVersion: "1.0.0",

    // --- Limity budowy ---
    maxBuildingsPerRegion: 3,
    maxInvestmentsPerTurn: 3,
    highCostConfirmThreshold: 1200,   // powyżej tego kosztu UI prosi o potwierdzenie

    // --- Ludność i podatki ---
    taxPerCitizen: 0.03,             // Geo$ / mieszkańca / turę (przy zadowoleniu 50)
    taxSatisfactionFactor: 0.5,      // podatki × (0.5 + satisfaction/100)
    adminBaseCost: 150,              // koszt administracji państwa / turę
    adminCostPerBuilding: 5,
    foodPerThousand: 2,              // konsumpcja żywności / 1000 mieszkańców
    energyPerThousand: 0.5,          // zużycie energii przez gospodarstwa domowe / 1000 mieszkańców
    baseGrowthRate: 0.01,            // 1% / turę
    growthSatisfactionFactor: 0.001, // + (satisfaction − 50) × 0.001
    foodShortageGrowthPenalty: 0.03,
    maxGrowthRate: 0.05,
    minGrowthRate: -0.05,

    // --- Technologia ---
    techProductionBonus: 0.005,      // produkcja × (1 + technology × 0.005)

    // --- Zadowolenie ---
    satisfaction: {
      foodShortage: -8,
      energyShortage: -4,
      budgetCrisis: -5,
      lowEnvironmentThreshold: 40,
      lowEnvironment: -3,
      highEnvironmentThreshold: 70,
      highEnvironment: 1,
      foodSurplus: 1,
      expectationThreshold: 60,      // powyżej tej wartości oczekiwania mieszkańców rosną
      expectationDrift: -1
    },

    // --- Środowisko ---
    environment: {
      naturalRecovery: 1,
      regionPollutionDecay: 1,
      highPollutionThreshold: 40,    // region z takim zanieczyszczeniem obniża środowisko
      highPollutionPenalty: -1,
      pollutionFarmPenalty: 0.5      // farma × (1 − pollution/100 × 0.5)
    },

    // --- Wydarzenia ---
    events: {
      firstTurn: 2,
      chancePerTurn: 0.6
    },

    // --- Punktacja końcowa ---
    scoring: {
      weights: { economy: 25, welfare: 25, infrastructure: 15, environment: 20, resilience: 15 },
      ratings: [
        { min: 80, id: "model" },
        { min: 60, id: "stable" },
        { min: 40, id: "developing" },
        { min: 0, id: "crisis" }
      ],
      economyBudgetTarget: 8000,
      economyIncomeTarget: 600,
      infrastructureBuildingsTarget: 16,
      populationGrowthTarget: 0.4
    }
  };
})(window.GT = window.GT || {});

</script>

  <script>/* ==== js/i18n/i18n.js ==== */
/*
 * i18n.js — prosty system tłumaczeń PL / EN.
 * Słowniki: js/i18n/pl.js, js/i18n/en.js (GT.I18N.pl / GT.I18N.en).
 * Teksty danych (regiony, budynki, wydarzenia) są w obiektach { pl, en } → GT.i18n.tx().
 * W HTML: data-i18n="klucz" (textContent), data-i18n-attr="aria-label:klucz;title:klucz2".
 */
(function (GT) {
  GT.I18N = GT.I18N || {};
  var SUPPORTED = ["pl", "en"];
  var lang = "pl";

  function lookup(dict, key) {
    if (!dict) return undefined;
    if (Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];
    return undefined;
  }

  /** Tłumaczy klucz; {param} zastępowane wartościami z params. */
  function t(key, params) {
    var s = lookup(GT.I18N[lang], key);
    if (s === undefined) s = lookup(GT.I18N.pl, key);
    if (s === undefined) return key;
    if (typeof s === "function") return s(params || {});
    return String(s).replace(/\{(\w+)\}/g, function (m, p) {
      return params && params[p] !== undefined ? params[p] : m;
    });
  }

  /** Tekst z obiektu danych { pl, en }. */
  function tx(obj) {
    if (!obj) return "";
    if (typeof obj === "string") return obj;
    return obj[lang] || obj.pl || "";
  }

  function has(key) { return lookup(GT.I18N[lang], key) !== undefined || lookup(GT.I18N.pl, key) !== undefined; }

  function num(n) {
    if (typeof n !== "number" || !isFinite(n)) return "–";
    try { return n.toLocaleString(lang === "pl" ? "pl-PL" : "en-GB"); } catch (e) { return String(n); }
  }

  function signed(n) {
    if (n > 0) return "+" + num(n);
    if (n < 0) return "−" + num(Math.abs(n));
    return "0";
  }

  function setLang(l) {
    if (SUPPORTED.indexOf(l) >= 0) lang = l;
    if (typeof document !== "undefined") {
      document.documentElement.lang = lang;
      applyStatic(document);
    }
  }

  function getLang() { return lang; }

  /** Tłumaczy statyczne elementy HTML oznaczone atrybutami data-i18n. */
  function applyStatic(root) {
    root.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    root.querySelectorAll("[data-i18n-attr]").forEach(function (el) {
      el.getAttribute("data-i18n-attr").split(";").forEach(function (pair) {
        var p = pair.split(":");
        if (p.length === 2) el.setAttribute(p[0].trim(), t(p[1].trim()));
      });
    });
  }

  GT.i18n = { SUPPORTED: SUPPORTED, t: t, tx: tx, has: has, num: num, signed: signed, setLang: setLang, getLang: getLang, applyStatic: applyStatic };
})(window.GT = window.GT || {});

</script>

  <script>/* ==== js/utils/validation.js ==== */
/*
 * Pomocnicze funkcje walidacji i liczb.
 */
(function (GT) {
  function clamp(v, min, max) {
    if (typeof v !== "number" || !isFinite(v)) return min;
    return Math.min(max, Math.max(min, v));
  }

  function safeInt(v, fallback) {
    if (typeof v !== "number" || !isFinite(v)) return fallback || 0;
    return Math.round(v);
  }

  function isObj(v) {
    return v !== null && typeof v === "object" && !Array.isArray(v);
  }

  function deepClone(o) {
    return JSON.parse(JSON.stringify(o));
  }

  function ok(data) {
    return { ok: true, data: data || null };
  }

  function fail(code, params) {
    return { ok: false, code: code, params: params || {} };
  }

  GT.util = { clamp: clamp, safeInt: safeInt, isObj: isObj, deepClone: deepClone, ok: ok, fail: fail };
})(window.GT = window.GT || {});

  <script>/* ==== js/utils/random.js ==== */
/*
 * Deterministyczny generator pseudolosowy (mulberry32) z ziarnem zapisywanym w stanie gry.
 * Dzięki temu wczytana rozgrywka losuje te same zdarzenia.
 */
(function (GT) {
  function next(state) {
    var t = (state.rngState = (state.rngState + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function weightedPick(state, items, weightFn) {
    var total = 0;
    for (var i = 0; i < items.length; i++) total += Math.max(0, weightFn(items[i]));
    if (total <= 0) return null;
    var r = next(state) * total;
    for (var j = 0; j < items.length; j++) {
      r -= Math.max(0, weightFn(items[j]));
      if (r < 0) return items[j];
    }
    return items[items.length - 1];
  }

  function newSeed() {
    return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
  }

  GT.random = { next: next, weightedPick: weightedPick, newSeed: newSeed };
})(window.GT = window.GT || {});

</script>
  <script>/* ==== js/state.js ==== */
/*
 * state.js — tworzenie stanu gry (GameState) ze scenariusza i funkcje odczytu.
 * Scenariusz jest szablonem: GameState zawiera głęboką kopię danych.
 * Brak zależności od DOM.
 */
(function (GT) {
  var U = GT.util;
  var SCHEMA_VERSION = 1;
  var REGION_NUMERIC = ["fertility", "waterAvailability", "sunlight", "windPotential", "mineralRichness",
    "terrainDifficulty", "tourismPotential", "urbanization", "pollution"];
  var RESOURCE_KEYS = ["budget", "food", "energy", "population", "satisfaction", "environment", "technology"];

  function scenarioById(id) {
    return GT.DATA.scenarios.filter(function (s) { return s.id === id; })[0] || null;
  }

  function buildingDef(id) {
    return GT.DATA.buildings.filter(function (b) { return b.id === id; })[0] || null;
  }

  function eventDef(id) {
    return GT.DATA.events.filter(function (e) { return e.id === id; })[0] || null;
  }

  function regionTemplate(id) {
    return GT.DATA.regions.filter(function (r) { return r.id === id; })[0] || null;
  }

  function buildRegion(tpl, mods) {
    var r = {
      id: tpl.id, col: tpl.col, row: tpl.row,
      terrainType: tpl.terrainType, climate: tpl.climate,
      coastal: !!tpl.coastal, river: !!tpl.river, forest: !!tpl.forest,
      irrigated: false, floodProtected: false, stormProtected: false, slopeProtected: false,
      buildings: []
    };
    REGION_NUMERIC.forEach(function (k) { r[k] = tpl[k]; });
    var all = (mods && mods.all) || {};
    Object.keys(all).forEach(function (k) { r[k] = (r[k] || 0) + all[k]; });
    var byId = (mods && mods.byId && mods.byId[tpl.id]) || null;
    if (byId) {
      if (byId.set) Object.keys(byId.set).forEach(function (k) { r[k] = byId.set[k]; });
      if (byId.delta) Object.keys(byId.delta).forEach(function (k) { r[k] = (r[k] || 0) + byId.delta[k]; });
    }
    REGION_NUMERIC.forEach(function (k) { r[k] = U.clamp(Math.round(r[k]), 0, 100); });
    return r;
  }

  /**
   * Tworzy nową grę. options: { maxTurns, lessonGoalId, seed }
   */
  function createGame(scenarioId, options) {
    options = options || {};
    var sc = scenarioById(scenarioId);
    if (!sc) return U.fail("UNKNOWN_SCENARIO");
    var seed = typeof options.seed === "number" ? options.seed >>> 0 : GT.random.newSeed();
    var now = new Date().toISOString();
    var lesson = GT.DATA.lessonGoals.filter(function (g) { return g.id === options.lessonGoalId; })[0];
    var state = {
      schemaVersion: SCHEMA_VERSION,
      gameId: "g" + seed.toString(36) + Date.now().toString(36),
      scenarioId: sc.id,
      lessonGoalId: lesson ? lesson.id : "none",
      turn: 1,
      maxTurns: options.maxTurns || 15,
      seed: seed,
      rngState: seed,
      resources: U.deepClone(sc.start),
      regions: GT.DATA.regions.map(function (tpl) { return buildRegion(tpl, sc.regionModifiers); }),
      modifiers: [],
      eventHistory: [],
      eventCooldowns: {},
      activeEvent: null,
      selectedRegionId: null,
      investmentsThisTurn: 0,
      flags: { energyShortage: false, foodShortage: false, budgetCrisis: false },
      stats: { foodShortageTurns: 0, energyShortageTurns: 0, budgetCrisisTurns: 0, resiliencePoints: 0,
               eventsHandled: 0, lastNet: 0, startPopulation: sc.start.population, buildingsBuilt: 0 },
      pendingMessages: [],
      lastReport: null,
      history: [],
      status: "playing",
      createdAt: now,
      updatedAt: now,
      nextBuildingId: 1
    };
    (sc.startBuildings || []).forEach(function (sb) {
      var reg = getRegion(state, sb.regionId);
      if (reg) reg.buildings.push(newBuilding(state, sb.buildingTypeId, reg.id, 0));
    });
    state.history.push(snapshot(state, 0));
    return U.ok(state);
  }

  function newBuilding(state, typeId, regionId, turn) {
    var id = "b" + state.nextBuildingId++;
    return { id: id, buildingTypeId: typeId, regionId: regionId, builtAtTurn: turn, level: 1, active: true };
  }

  function snapshot(state, turn) {
    var s = { turn: turn };
    RESOURCE_KEYS.forEach(function (k) { s[k] = state.resources[k]; });
    s.buildings = countBuildings(state);
    return s;
  }

  function getRegion(state, id) {
    for (var i = 0; i < state.regions.length; i++) if (state.regions[i].id === id) return state.regions[i];
    return null;
  }

  function countBuildings(state, filterFn) {
    var n = 0;
    state.regions.forEach(function (r) {
      r.buildings.forEach(function (b) { if (!filterFn || filterFn(b, r)) n++; });
    });
    return n;
  }

  /** Budynek działa od tury następującej po turze budowy. */
  function isOperational(state, b) {
    return b.active && b.builtAtTurn < state.turn;
  }

  /** Szacowana ludność regionu: populacja kraju rozdzielona proporcjonalnie do urbanizacji. */
  function regionPopulation(state, region) {
    var total = 0;
    state.regions.forEach(function (r) { total += Math.max(1, r.urbanization); });
    return Math.round(state.resources.population * Math.max(1, region.urbanization) / total);
  }

  function selectRegion(state, id) {
    if (id !== null && !getRegion(state, id)) return U.fail("UNKNOWN_REGION");
    state.selectedRegionId = id;
    return U.ok();
  }

  /** Iloczyn czynników modyfikatorów danego rodzaju (dla regionu lub globalnie). */
  function modifierFactor(state, kind, regionId) {
    var f = 1;
    state.modifiers.forEach(function (m) {
      if (m.kind !== kind || typeof m.factor !== "number") return;
      if (m.scope === "global" || m.regionId === regionId) f *= m.factor;
    });
    return f;
  }

  function modifierDelta(state, kind) {
    var d = 0;
    state.modifiers.forEach(function (m) { if (m.kind === kind && typeof m.delta === "number") d += m.delta; });
    return d;
  }

  GT.state = {
    SCHEMA_VERSION: SCHEMA_VERSION,
    RESOURCE_KEYS: RESOURCE_KEYS,
    REGION_NUMERIC: REGION_NUMERIC,
    createGame: createGame,
    scenarioById: scenarioById,
    buildingDef: buildingDef,
    eventDef: eventDef,
    regionTemplate: regionTemplate,
    getRegion: getRegion,
    countBuildings: countBuildings,
    isOperational: isOperational,
    regionPopulation: regionPopulation,
    selectRegion: selectRegion,
    modifierFactor: modifierFactor,
    modifierDelta: modifierDelta,
    newBuilding: newBuilding,
    snapshot: snapshot
  };
})(window.GT = window.GT || {});

</script>
  <script>/* ==== js/economy.js ==== */
/*
 * economy.js — produkcja, konsumpcja, dochody, utrzymanie, niedobory,
 * ludność, zadowolenie i środowisko. Bez zależności od DOM.
 *
 * Funkcje zapisują komunikaty do raportu tury jako { key, params, tone },
 * żeby UI mogło je wyświetlić w aktualnym języku.
 */
(function (GT) {
  var U = GT.util, S = GT.state;

  function B() { return GT.DATA.balance; }

  function techMultiplier(state) {
    return 1 + state.resources.technology * B().techProductionBonus;
  }

  /** Bazowa wydajność budynku w regionie (geografia + technologia, bez wydarzeń). */
  function rawOutput(state, region, def) {
    var out = { food: 0, energy: 0, income: 0 };
    var tech = techMultiplier(state);
    Object.keys(def.produces || {}).forEach(function (k) {
      var p = def.produces[k];
      var v = p.base;
      (p.scale || []).forEach(function (attr) { v *= (region[attr] || 0) / 100; });
      if (k === "food") v *= 1 - (region.pollution / 100) * B().environment.pollutionFarmPenalty;
      out[k] = v * tech;
    });
    out.food = Math.round(out.food);
    out.energy = Math.round(out.energy);
    out.income = Math.round(out.income);
    return out;
  }

  /** Wydajność z modyfikatorami wydarzeń (powódź, susza, sztorm, regulacje...). */
  function effectiveOutput(state, region, def) {
    var out = rawOutput(state, region, def);
    var regionF = S.modifierFactor(state, "regionOutput", region.id);
    out.food *= regionF * S.modifierFactor(state, "farmOutput", region.id);
    out.energy *= regionF;
    out.income *= regionF;
    if (def.category === "trade") out.income *= S.modifierFactor(state, "tradeOutput", region.id);
    if (def.category === "industry") out.income *= S.modifierFactor(state, "industryIncome", region.id);
    return out;
  }

  /** Krok 2–3: produkcja budynków. */
  function calculateProduction(state) {
    var p = { food: 0, energy: 0, industryIncome: 0, otherIncome: 0, tech: 0, satisfaction: 0,
              env: 0, active: 0, byType: {} };
    state.regions.forEach(function (region) {
      region.buildings.forEach(function (b) {
        if (!S.isOperational(state, b)) return;
        var def = S.buildingDef(b.buildingTypeId);
        if (!def) return;
        p.active++;
        var o = effectiveOutput(state, region, def);
        p.food += o.food;
        p.energy += o.energy;
        if (def.category === "industry") p.industryIncome += o.income; else p.otherIncome += o.income;
        var t = def.perTurn || {};
        p.tech += t.technology || 0;
        p.satisfaction += t.satisfaction || 0;
        p.env += t.env || 0;
        p.byType[def.id] = (p.byType[def.id] || 0) + 1;
      });
    });
    p.food = Math.round(p.food);
    p.energy = Math.round(p.energy);
    return p;
  }

  /** Krok 4–5: konsumpcja żywności i energii. */
  function calculateConsumption(state) {
    var pop = state.resources.population;
    var energyUse = pop / 1000 * B().energyPerThousand;
    state.regions.forEach(function (region) {
      region.buildings.forEach(function (b) {
        if (!S.isOperational(state, b)) return;
        var def = S.buildingDef(b.buildingTypeId);
        if (def) energyUse += def.energyUse || 0;
      });
    });
    energyUse *= S.modifierFactor(state, "energyUse", null);
    return { food: Math.round(pop / 1000 * B().foodPerThousand), energy: Math.round(energyUse) };
  }

  /** Krok 6: podatki, utrzymanie i administracja. */
  function calculateMaintenance(state) {
    var upkeep = 0, n = 0;
    state.regions.forEach(function (region) {
      region.buildings.forEach(function (b) {
        n++;
        if (!S.isOperational(state, b)) return;
        var def = S.buildingDef(b.buildingTypeId);
        if (def) upkeep += def.maintenance;
      });
    });
    var admin = B().adminBaseCost + B().adminCostPerBuilding * n;
    var taxes = state.resources.population * B().taxPerCitizen *
      (B().taxSatisfactionFactor + state.resources.satisfaction / 100);
    return { upkeep: Math.round(upkeep), admin: Math.round(admin), taxes: Math.round(taxes) };
  }

  /**
   * Kroki 7–8: aktualizacja magazynów i obsługa niedoborów.
   * Magazyny nie są ujemne — brakująca ilość trafia do deficytu.
   */
  function settleResources(state, prod, cons, costs, report) {
    var r = state.resources;
    // Energia: przy niedoborze przemysł pracuje z ograniczoną wydajnością
    var energyAvailable = r.energy + prod.energy;
    var efficiency = 1;
    if (energyAvailable < cons.energy) {
      efficiency = cons.energy > 0 ? Math.max(0, energyAvailable) / cons.energy : 1;
      report.deficits.energy = cons.energy - energyAvailable;
      r.energy = 0;
    } else {
      r.energy = energyAvailable - cons.energy;
    }
    var industryIncome = Math.round(prod.industryIncome * efficiency);
    var income = industryIncome + Math.round(prod.otherIncome) + costs.taxes;
    var expenses = costs.upkeep + costs.admin;
    var net = income - expenses;
    r.budget += net;
    state.stats.lastNet = net;

    // Żywność
    var foodAvailable = r.food + prod.food;
    if (foodAvailable < cons.food) {
      report.deficits.food = cons.food - foodAvailable;
      r.food = 0;
    } else {
      r.food = foodAvailable - cons.food;
    }

    state.flags.energyShortage = report.deficits.energy > 0;
    state.flags.foodShortage = report.deficits.food > 0;
    state.flags.budgetCrisis = r.budget < 0;
    if (state.flags.energyShortage) state.stats.energyShortageTurns++;
    if (state.flags.foodShortage) state.stats.foodShortageTurns++;
    if (state.flags.budgetCrisis) state.stats.budgetCrisisTurns++;

    report.breakdown = {
      taxes: costs.taxes, industryIncome: industryIncome, otherIncome: Math.round(prod.otherIncome),
      upkeep: costs.upkeep, admin: costs.admin, net: net,
      foodProduced: prod.food, foodConsumed: cons.food,
      energyProduced: prod.energy, energyConsumed: cons.energy,
      efficiency: Math.round(efficiency * 100)
    };

    var m = report.messages;
    if (prod.food > 0) m.push({ key: "msg.foodProduced", params: { n: prod.food }, tone: "good" });
    m.push({ key: "msg.foodConsumed", params: { n: cons.food }, tone: "neutral" });
    if (prod.energy > 0) m.push({ key: "msg.energyProduced", params: { n: prod.energy }, tone: "good" });
    if (cons.energy > 0) m.push({ key: "msg.energyConsumed", params: { n: cons.energy }, tone: "neutral" });
    m.push({ key: "msg.taxes", params: { n: costs.taxes }, tone: "good" });
    if (prod.industryIncome > 0) m.push({ key: "msg.industryIncome", params: { n: industryIncome }, tone: "good" });
    if (prod.otherIncome > 0) m.push({ key: "msg.tradeIncome", params: { n: Math.round(prod.otherIncome) }, tone: "good" });
    m.push({ key: "msg.upkeep", params: { n: costs.upkeep + costs.admin }, tone: "neutral" });
    if (report.deficits.food > 0) m.push({ key: "msg.foodShortage", params: { n: report.deficits.food }, tone: "bad" });
    if (report.deficits.energy > 0) m.push({ key: "msg.energyShortage", params: { n: report.deficits.energy, pct: Math.round(efficiency * 100) }, tone: "bad" });
    if (state.flags.budgetCrisis) m.push({ key: "msg.budgetCrisis", params: {}, tone: "bad" });
  }

  /** Krok 9a: ludność. */
  function updatePopulation(state, report) {
    var b = B(), r = state.resources;
    var rate = b.baseGrowthRate + (r.satisfaction - 50) * b.growthSatisfactionFactor;
    if (state.flags.foodShortage) rate -= b.foodShortageGrowthPenalty;
    rate = U.clamp(rate, b.minGrowthRate, b.maxGrowthRate);
    var delta = Math.round(r.population * rate);
    r.population = Math.max(0, r.population + delta);
    if (delta > 0) report.messages.push({ key: "msg.popGrowth", params: { n: delta }, tone: "good" });
    else if (delta < 0) report.messages.push({ key: "msg.popDecline", params: { n: -delta }, tone: "bad" });
  }

  /** Krok 9b: zadowolenie (0–100). */
  function updateSatisfaction(state, prod, report) {
    var s = B().satisfaction, r = state.resources, d = 0;
    if (state.flags.foodShortage) d += s.foodShortage;
    if (state.flags.energyShortage) d += s.energyShortage;
    if (state.flags.budgetCrisis) d += s.budgetCrisis;
    if (r.environment < s.lowEnvironmentThreshold) {
      d += s.lowEnvironment;
      report.messages.push({ key: "msg.envHurtsMood", params: {}, tone: "bad" });
    } else if (r.environment >= s.highEnvironmentThreshold) d += s.highEnvironment;
    if (!state.flags.foodShortage && r.food >= report.breakdown.foodConsumed * 2 && report.breakdown.foodConsumed > 0) d += s.foodSurplus;
    if (r.satisfaction > s.expectationThreshold) d += s.expectationDrift;
    d += prod.satisfaction;
    if (prod.satisfaction > 0) report.messages.push({ key: "msg.servicesMood", params: { n: prod.satisfaction }, tone: "good" });
    r.satisfaction = U.clamp(Math.round(r.satisfaction + d), 0, 100);
  }

  /** Krok 9c: środowisko (0–100), zanieczyszczenie regionów i technologia. */
  function updateEnvironment(state, prod, report) {
    var e = B().environment, r = state.resources;
    var d = prod.env + e.naturalRecovery + S.modifierDelta(state, "envPerTurn");
    state.regions.forEach(function (region) {
      var p = -e.regionPollutionDecay;
      region.buildings.forEach(function (b) {
        if (!S.isOperational(state, b)) return;
        var def = S.buildingDef(b.buildingTypeId);
        if (def && def.perTurn && def.perTurn.pollution) p += def.perTurn.pollution;
      });
      region.pollution = U.clamp(Math.round(region.pollution + p), 0, 100);
      if (region.pollution >= e.highPollutionThreshold) d += e.highPollutionPenalty;
    });
    var before = r.environment;
    r.environment = U.clamp(Math.round(r.environment + d), 0, 100);
    if (r.environment < before) report.messages.push({ key: "msg.envWorse", params: { n: before - r.environment }, tone: "bad" });
    else if (r.environment > before) report.messages.push({ key: "msg.envBetter", params: { n: r.environment - before }, tone: "good" });
    if (prod.tech > 0) {
      r.technology = U.clamp(r.technology + prod.tech, 0, 100);
      report.messages.push({ key: "msg.techUp", params: { n: prod.tech }, tone: "good" });
    }
  }

  /** Zaokrąglenia i zabezpieczenie przed NaN/Infinity oraz złymi zakresami. */
  function sanitize(state) {
    var r = state.resources;
    r.budget = U.safeInt(r.budget, 0);
    r.food = Math.max(0, U.safeInt(r.food, 0));
    r.energy = Math.max(0, U.safeInt(r.energy, 0));
    r.population = Math.max(0, U.safeInt(r.population, 0));
    ["satisfaction", "environment", "technology"].forEach(function (k) { r[k] = U.clamp(U.safeInt(r[k], 0), 0, 100); });
  }

  GT.economy = {
    techMultiplier: techMultiplier,
    rawOutput: rawOutput,
    effectiveOutput: effectiveOutput,
    calculateProduction: calculateProduction,
    calculateConsumption: calculateConsumption,
    calculateMaintenance: calculateMaintenance,
    settleResources: settleResources,
    updatePopulation: updatePopulation,
    updateSatisfaction: updateSatisfaction,
    updateEnvironment: updateEnvironment,
    sanitize: sanitize
  };
})(window.GT = window.GT || {});

</script>
  <script>/* ==== js/buildings.js ==== */
/*
 * buildings.js — walidacja wymagań, budowa, rozbiórka i koszty budynków.
 * Każda akcja zwraca { ok, data } lub { ok:false, code, params }.
 */
(function (GT) {
  var U = GT.util, S = GT.state;

  function balance() { return GT.DATA.balance; }

  /** Lista niespełnionych wymagań geograficznych (pusta = OK). */
  function unmetRequirements(state, region, def) {
    var out = [];
    (def.requirements || []).forEach(function (req) {
      switch (req.type) {
        case "attrMin":
          if ((region[req.attr] || 0) < req.value)
            out.push({ code: "REQ_ATTR", params: { attr: req.attr, value: req.value, actual: region[req.attr] || 0 } });
          break;
        case "flag":
          if (!region[req.attr]) out.push({ code: "REQ_FLAG", params: { attr: req.attr } });
          break;
        case "notDesertOrIrrigated":
          if (region.terrainType === "desert" && !region.irrigated) out.push({ code: "REQ_NOT_DESERT", params: {} });
          break;
        case "regionPopMin":
          var pop = S.regionPopulation(state, region);
          if (pop < req.value) out.push({ code: "REQ_POP", params: { value: req.value, actual: pop } });
          break;
        case "urbanOrPollution":
          if (region.urbanization < req.urbanization && region.pollution < req.pollution)
            out.push({ code: "REQ_URBAN_OR_POLLUTION", params: { urbanization: req.urbanization, pollution: req.pollution } });
          break;
      }
    });
    return out;
  }

  /** Koszt budowy z uwzględnieniem modyfikatorów (np. dotacja na elektrownie). */
  function buildCost(state, def) {
    var cost = def.cost;
    if (def.category === "energy") cost *= S.modifierFactor(state, "energyCost", null);
    return Math.round(cost);
  }

  /**
   * Sprawdza, czy można zbudować. opts: { ignoreCost, ignoreTurnLimit, costOverride }
   */
  function canBuild(state, regionId, typeId, opts) {
    opts = opts || {};
    if (state.status !== "playing") return U.fail("GAME_OVER");
    var region = S.getRegion(state, regionId);
    if (!region) return U.fail("UNKNOWN_REGION");
    var def = S.buildingDef(typeId);
    if (!def) return U.fail("UNKNOWN_BUILDING");
    var B = balance();
    if (region.buildings.length >= B.maxBuildingsPerRegion)
      return U.fail("REGION_FULL", { max: B.maxBuildingsPerRegion });
    var sameType = region.buildings.filter(function (b) { return b.buildingTypeId === typeId; }).length;
    if (sameType >= def.maxPerRegion) return U.fail("TYPE_LIMIT", { max: def.maxPerRegion });
    var unmet = unmetRequirements(state, region, def);
    if (unmet.length) return U.fail(unmet[0].code, unmet[0].params);
    if (!opts.ignoreTurnLimit && state.investmentsThisTurn >= B.maxInvestmentsPerTurn)
      return U.fail("TURN_LIMIT", { max: B.maxInvestmentsPerTurn });
    var cost = typeof opts.costOverride === "number" ? opts.costOverride : buildCost(state, def);
    if (!opts.ignoreCost && state.resources.budget < cost)
      return U.fail("NO_BUDGET", { cost: cost, budget: state.resources.budget });
    return U.ok({ cost: cost });
  }

  /** Buduje budynek: pobiera koszt natychmiast; budynek działa od następnej tury. */
  function build(state, regionId, typeId, opts) {
    opts = opts || {};
    var check = canBuild(state, regionId, typeId, opts);
    if (!check.ok) return check;
    var region = S.getRegion(state, regionId);
    var cost = opts.ignoreCost ? 0 : check.data.cost;
    state.resources.budget -= cost;
    var b = S.newBuilding(state, typeId, regionId, state.turn);
    region.buildings.push(b);
    if (!opts.ignoreTurnLimit) state.investmentsThisTurn += 1;
    state.stats.buildingsBuilt += 1;
    state.updatedAt = new Date().toISOString();
    return U.ok({ building: b, cost: cost });
  }

  /** Rozbiórka — bez zwrotu kosztów. */
  function demolish(state, regionId, buildingId) {
    if (state.status !== "playing") return U.fail("GAME_OVER");
    var region = S.getRegion(state, regionId);
    if (!region) return U.fail("UNKNOWN_REGION");
    var idx = -1;
    region.buildings.forEach(function (b, i) { if (b.id === buildingId) idx = i; });
    if (idx < 0) return U.fail("UNKNOWN_BUILDING");
    var removed = region.buildings.splice(idx, 1)[0];
    return U.ok({ building: removed });
  }

  /** Podgląd efektu budynku w danym regionie (do kart w UI). */
  function preview(state, regionId, typeId) {
    var region = S.getRegion(state, regionId);
    var def = S.buildingDef(typeId);
    if (!region || !def) return null;
    var out = GT.economy.rawOutput(state, region, def);
    return {
      food: out.food, energy: out.energy, income: out.income,
      energyUse: def.energyUse || 0,
      maintenance: def.maintenance,
      perTurn: def.perTurn || {},
      cost: buildCost(state, def)
    };
  }

  GT.buildings = {
    unmetRequirements: unmetRequirements,
    buildCost: buildCost,
    canBuild: canBuild,
    build: build,
    demolish: demolish,
    preview: preview
  };
})(window.GT = window.GT || {});

</script>
  <script>/* ==== js/events.js ==== */
/*
 * events.js — warunki wydarzeń, losowanie (z ziarnem), cooldown, decyzje i efekty.
 * Bez zależności od DOM.
 */
(function (GT) {
  var U = GT.util, S = GT.state;

  // ---------- Warunki ----------
  function checkCondition(state, cond, region) {
    switch (cond.type) {
      case "region":
        if (!region) return false;
        var v = region[cond.attr] || 0;
        if (typeof cond.min === "number" && v < cond.min) return false;
        if (typeof cond.max === "number" && v > cond.max) return false;
        return true;
      case "regionFlag":
        return !!region && !!region[cond.attr] === !!cond.value;
      case "regionHas":
        return !!region && region.buildings.some(function (b) { return b.buildingTypeId === cond.building; });
      case "regionBuildings":
        return !!region && region.buildings.length >= cond.min;
      case "resource":
        var rv = state.resources[cond.key];
        if (typeof cond.min === "number" && rv < cond.min) return false;
        if (typeof cond.max === "number" && rv > cond.max) return false;
        return true;
      case "stateFlag":
        return !!state.flags[cond.key];
      case "categoryCount":
        return S.countBuildings(state, function (b) {
          var d = S.buildingDef(b.buildingTypeId);
          return d && d.category === cond.category;
        }) >= cond.min;
      case "any":
        return (cond.of || []).some(function (c) { return checkCondition(state, c, region); });
      default:
        return false;
    }
  }

  function conditionsMet(state, def, region) {
    return (def.conditions || []).every(function (c) { return checkCondition(state, c, region); });
  }

  /** Regiony, w których wydarzenie może wystąpić (dla scope=region). */
  function eligibleRegions(state, def) {
    return state.regions.filter(function (r) { return conditionsMet(state, def, r); });
  }

  function isOnCooldown(state, def) {
    var until = state.eventCooldowns[def.id];
    return typeof until === "number" && state.turn < until;
  }

  /** Lista kandydatów { def, regions } spełniających warunki i bez cooldownu. */
  function candidates(state) {
    var sc = S.scenarioById(state.scenarioId);
    var weights = (sc && sc.eventWeights) || {};
    var list = [];
    GT.DATA.events.forEach(function (def) {
      if (isOnCooldown(state, def)) return;
      var regions = null;
      if (def.scope === "region") {
        regions = eligibleRegions(state, def);
        if (!regions.length) return;
      } else if (!conditionsMet(state, def, null)) return;
      var w = def.weight * (typeof weights[def.id] === "number" ? weights[def.id] : 1);
      if (w > 0) list.push({ def: def, regions: regions, weight: w });
    });
    return list;
  }

  /** Uruchamia wydarzenie: efekt początkowy + oczekiwanie na decyzję gracza. */
  function triggerEvent(state, def, regionId, report) {
    state.activeEvent = { eventId: def.id, regionId: regionId || null, turn: state.turn };
    state.eventCooldowns[def.id] = state.turn + (def.cooldown || 3);
    applyEffects(state, def.onTrigger || [], regionId, report);
    state.eventHistory.push({ turn: state.turn, eventId: def.id, regionId: regionId || null, choiceId: null });
    if (report) report.event = { eventId: def.id, regionId: regionId || null };
    return state.activeEvent;
  }

  /**
   * Krok 10: maksymalnie jedno wydarzenie na turę.
   * forceId — wymuszenie konkretnego wydarzenia (tryb debugowania / testy).
   */
  function maybeTriggerEvent(state, report, forceId) {
    if (state.activeEvent) return null;
    var cfg = GT.DATA.balance.events;
    if (forceId) {
      var fdef = S.eventDef(forceId);
      if (!fdef) return null;
      var regs = fdef.scope === "region" ? eligibleRegions(state, fdef) : null;
      if (fdef.scope === "region" && !regs.length) regs = state.regions.slice();
      var reg = regs ? regs[Math.floor(GT.random.next(state) * regs.length)] : null;
      return triggerEvent(state, fdef, reg ? reg.id : null, report);
    }
    if (state.turn < cfg.firstTurn) return null;
    if (GT.random.next(state) >= cfg.chancePerTurn) return null;
    var list = candidates(state);
    var pick = GT.random.weightedPick(state, list, function (c) { return c.weight; });
    if (!pick) return null;
    var region = null;
    if (pick.regions) region = pick.regions[Math.floor(GT.random.next(state) * pick.regions.length)];
    return triggerEvent(state, pick.def, region ? region.id : null, report);
  }

  // ---------- Efekty ----------
  function findModifier(state, tag, regionId) {
    return state.modifiers.filter(function (m) {
      return m.tag === tag && (m.scope === "global" || m.regionId === regionId);
    });
  }

  function applyEffects(state, effects, regionId, report) {
    var region = regionId ? S.getRegion(state, regionId) : null;
    effects.forEach(function (e) {
      switch (e.type) {
        case "res":
          state.resources[e.key] = (state.resources[e.key] || 0) + e.delta;
          break;
        case "resPct":
          state.resources[e.key] = Math.round(state.resources[e.key] * (1 + e.pct / 100));
          break;
        case "regionAttr":
          if (region) region[e.attr] = U.clamp(Math.round((region[e.attr] || 0) + e.delta), 0, 100);
          break;
        case "regionFlag":
          if (region) region[e.flag] = !!e.value;
          break;
        case "modifier":
          state.modifiers.push({
            tag: e.tag, kind: e.kind, factor: e.factor, delta: e.delta,
            turnsLeft: e.turns, scope: e.scope || "global",
            regionId: e.scope === "region" ? regionId : null,
            eventId: state.activeEvent ? state.activeEvent.eventId : null
          });
          break;
        case "removeModifier":
          state.modifiers = state.modifiers.filter(function (m) {
            return !(m.tag === e.tag && (m.scope === "global" || m.regionId === regionId));
          });
          break;
        case "setModifier":
          findModifier(state, e.tag, regionId).forEach(function (m) {
            if (typeof e.factor === "number") m.factor = e.factor;
            if (typeof e.turns === "number") m.turnsLeft = e.turns;
          });
          break;
        case "build":
          if (region) GT.buildings.build(state, region.id, e.building, { ignoreCost: true, ignoreTurnLimit: true });
          break;
      }
    });
    GT.economy.sanitize(state);
  }

  /** Czy wybór jest dostępny (budżet, możliwość budowy). */
  function choiceAvailability(state, choice) {
    var ev = state.activeEvent;
    if (choice.cost > state.resources.budget)
      return U.fail("NO_BUDGET", { cost: choice.cost, budget: state.resources.budget });
    if (choice.requires && choice.requires.buildable) {
      var chk = GT.buildings.canBuild(state, ev && ev.regionId, choice.requires.buildable,
        { ignoreCost: true, ignoreTurnLimit: true });
      if (!chk.ok) return chk;
    }
    return U.ok();
  }

  /** Gracz podejmuje decyzję dotyczącą aktywnego wydarzenia. */
  function resolveChoice(state, choiceId) {
    var ev = state.activeEvent;
    if (!ev) return U.fail("NO_ACTIVE_EVENT");
    var def = S.eventDef(ev.eventId);
    if (!def) { state.activeEvent = null; return U.fail("UNKNOWN_EVENT"); }
    var choice = def.choices.filter(function (c) { return c.id === choiceId; })[0];
    if (!choice) return U.fail("UNKNOWN_CHOICE");
    var avail = choiceAvailability(state, choice);
    if (!avail.ok) return avail;
    state.resources.budget -= choice.cost;
    applyEffects(state, choice.effects || [], ev.regionId, null);
    state.stats.resiliencePoints += choice.resilience || 0;
    state.stats.eventsHandled += 1;
    for (var i = state.eventHistory.length - 1; i >= 0; i--) {
      var h = state.eventHistory[i];
      if (h.eventId === ev.eventId && h.choiceId === null) { h.choiceId = choice.id; break; }
    }
    state.pendingMessages.push({ key: "msg.decision", params: { eventId: ev.eventId, choiceId: choice.id, regionId: ev.regionId }, tone: "neutral" });
    state.activeEvent = null;
    state.updatedAt = new Date().toISOString();
    return U.ok({ eventId: def.id, choiceId: choice.id });
  }

  /** Odliczanie czasu trwania modyfikatorów (po rozliczeniu produkcji). */
  function tickModifiers(state, report) {
    state.modifiers.forEach(function (m) { m.turnsLeft -= 1; });
    var expired = state.modifiers.filter(function (m) { return m.turnsLeft <= 0; });
    state.modifiers = state.modifiers.filter(function (m) { return m.turnsLeft > 0; });
    expired.forEach(function (m) {
      if (report) report.messages.push({ key: "msg.modifierEnded", params: { tag: m.tag, regionId: m.regionId }, tone: "good" });
    });
  }

  GT.events = {
    checkCondition: checkCondition,
    conditionsMet: conditionsMet,
    eligibleRegions: eligibleRegions,
    candidates: candidates,
    triggerEvent: triggerEvent,
    maybeTriggerEvent: maybeTriggerEvent,
    applyEffects: applyEffects,
    choiceAvailability: choiceAvailability,
    resolveChoice: resolveChoice,
    tickModifiers: tickModifiers
  };
})(window.GT = window.GT || {});

</script>
  <script>/* ==== js/scoring.js ==== */
/*
 * scoring.js — ocena końcowa państwa w 5 wymiarach (0–100) i sprawdzanie celów scenariusza.
 */
(function (GT) {
  var U = GT.util, S = GT.state;
  var DIMENSIONS = ["economy", "welfare", "infrastructure", "environment", "resilience"];

    var economy = ratio(r.budget, cfg.economyBudgetTarget) * 50 + ratio(st.lastNet, cfg.economyIncomeTarget) * 50;

    var growth = st.startPopulation > 0 ? r.population / st.startPopulation - 1 : 0;
    var welfare = r.satisfaction * 0.6 + (1 - U.clamp(st.foodShortageTurns / turnsPlayed, 0, 1)) * 25 +
      ratio(growth, cfg.populationGrowthTarget) * 15;

    var types = {}, total = 0, protections = 0, energyTypes = {};

        var d = S.buildingDef(b.buildingTypeId);

      ratio(Object.keys(types).length, GT.DATA.buildings.length) * 30;

    var avgPollution = state.regions.reduce(function (s, x) { return s + x.pollution; }, 0) / state.regions.length;

  <script>/* ==== js/gameLoop.js ==== */
/*
 * gameLoop.js — zakończenie tury w ustalonej kolejności (spec. rozdz. 14.1).
 * Zwraca raport tury (różnice zasobów + komunikaty) — UI tylko go wyświetla.
 */
(function (GT) {
  var U = GT.util, S = GT.state, E = GT.economy;

  function endTurn(state, opts) {
    opts = opts || {};
    if (state.status !== "playing") return U.fail("GAME_OVER");
    if (state.activeEvent) return U.fail("EVENT_PENDING");

    var before = U.deepClone(state.resources);
    var processedTurn = state.turn;
    var report = { turn: processedTurn, deltas: {}, messages: [], deficits: { food: 0, energy: 0 }, event: null, breakdown: null };

    // Decyzje z poprzednich wydarzeń — widoczne w podsumowaniu
    report.messages = report.messages.concat(state.pendingMessages);
    state.pendingMessages = [];

    // Budynki zbudowane w tej turze zaczną działać po jej zakończeniu
    var newlyBuilt = S.countBuildings(state, function (b) { return b.builtAtTurn === processedTurn; });

    // 2–3. produkcja z modyfikatorami geograficznymi i wydarzeń
    var prod = E.calculateProduction(state);
    // 4–5. konsumpcja
    var cons = E.calculateConsumption(state);
    // 6. dochody i koszty
    var costs = E.calculateMaintenance(state);
    // 7–8. magazyny i niedobory
    E.settleResources(state, prod, cons, costs, report);
    // 9. ludność, zadowolenie, środowisko
    E.updatePopulation(state, report);
    E.updateSatisfaction(state, prod, report);
    E.updateEnvironment(state, prod, report);
    E.sanitize(state);
    if (newlyBuilt > 0) report.messages.push({ key: "msg.newBuildings", params: { n: newlyBuilt }, tone: "good" });

    // 1. zwiększ numer tury (nowe budynki działają od następnej tury)
    state.turn += 1;
    state.investmentsThisTurn = 0;
    GT.events.tickModifiers(state, report);

    // 10. wydarzenie (najwyżej jedno na turę) — nie losujemy po ostatniej turze
    if (state.turn <= state.maxTurns) GT.events.maybeTriggerEvent(state, report, opts.forceEventId || null);
    E.sanitize(state);

    // 11. stan, log, historia
    S.RESOURCE_KEYS.forEach(function (k) { report.deltas[k] = state.resources[k] - before[k]; });
    state.history.push(S.snapshot(state, processedTurn));
    state.lastReport = report;
    state.updatedAt = new Date().toISOString();

    // 12. koniec gry
    if (state.turn > state.maxTurns) finishGame(state);
    return U.ok(report);
  }

  function finishGame(state) {
    state.status = "finished";
    state.activeEvent = null;
    state.finalScore = GT.scoring.computeScore(state);
    return state.finalScore;
  }

  /**
   * Prognoza zmian na koniec bieżącej tury (bez wydarzeń) — dla podpowiedzi w UI.
   * Działa na kopii stanu, więc niczego nie zmienia.
   */
  function forecast(state) {
    var s = U.deepClone(state);
    var report = { messages: [], deficits: { food: 0, energy: 0 } };
    var prod = E.calculateProduction(s), cons = E.calculateConsumption(s), costs = E.calculateMaintenance(s);
    E.settleResources(s, prod, cons, costs, report);
    var out = {};
    S.RESOURCE_KEYS.forEach(function (k) { out[k] = s.resources[k] - state.resources[k]; });
    out.foodShortage = report.deficits.food > 0;
    out.energyShortage = report.deficits.energy > 0;
    out.budgetCrisis = s.resources.budget < 0;
    return out;
  }

  <script>/* ==== js/saveManager.js ==== */
/*
 * saveManager.js — zapis/odczyt w localStorage, kopia zapasowa, walidacja, eksport/import JSON.
 * Klucz: geotycoon.save.v1 (+ .backup). Uszkodzony zapis nie jest nadpisywany automatycznie.
 */
(function (GT) {
  var U = GT.util;
  var SAVE_KEY = "geotycoon.save.v1";
  var BACKUP_KEY = "geotycoon.save.v1.backup";
  var SETTINGS_KEY = "geotycoon.settings";

  // Magazyn można podmienić w testach (np. obiekt w pamięci).
  var storage = null;
  function store() {
    if (storage) return storage;
    try { if (typeof localStorage !== "undefined") return localStorage; } catch (e) { /* brak dostępu */ }
    var mem = {};
